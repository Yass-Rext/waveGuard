# monitoring/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métriques Spark (via JMX Exporter)
  - job_name: 'spark'
    static_configs:
      - targets: ['spark:8080']
    
  # Métriques Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    
  # Métriques PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']