# version: "3.9"

services:

  #####################################################################
  # ZOOKEEPER
  #####################################################################
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    networks:
      - waveguard


  #####################################################################
  # KAFKA
  #####################################################################
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    networks:
      - waveguard


  #####################################################################
  # MINIO (Data Lake)
  #####################################################################
  minio:
    image: minio/minio
    container_name: minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - waveguard


  #####################################################################
# SPARK + JUPYTER
#####################################################################
  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile

    container_name: spark
    ports:
      # - "8080:8080"
      - "4040:4040"

    restart: unless-stopped

    

    working_dir: /opt/spark/work-dir

    volumes:
      - ./spark:/opt/spark/work-dir
      - ./producer:/opt/spark/producer
      - ./data/metrics:/tmp/metrics
      - ./checkpoints:/tmp/waveguard_checkpoints
      - ./monitoring:/opt/spark/work-dir/monitoring
      - ~/.ivy2:/home/spark/.ivy2
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark
      - PYTHONPATH=/opt/spark/work-dir

    

    networks:
      - waveguard
    
    depends_on:
      - kafka
      - minio
      - postgres
  #####################################################################
  # AIRFLOW
  #####################################################################
  airflow:
    image: apache/airflow:2.7.1

    container_name: airflow

    restart: unless-stopped

    depends_on:
      - kafka

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AIRFLOW__WEBSERVER__SECRET_KEY: waveguard_secret

    command: >
      bash -c "
      airflow db init &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@waveguard.com &&
      airflow webserver
      "

    volumes:
      - ./dags:/opt/airflow/dags

      - ./producer:/opt/airflow/producer

      - ./spark:/opt/airflow/spark

    networks:
      - waveguard

  #####################################################################
# POSTGRESQL - Base de données métier
#####################################################################
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: waveguard
      POSTGRES_PASSWORD: waveguard123
      POSTGRES_DB: waveguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./monitoring/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - waveguard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waveguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  #####################################################################
# PROMETHEUS - Métriques techniques
#####################################################################
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - waveguard
    depends_on:
      - postgres


 #####################################################################
# GRAFANA - (modifié)
#####################################################################
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    networks:
      - waveguard
    depends_on:
      - postgres
      - prometheus

volumes:
  minio_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  waveguard:
    driver: bridge


