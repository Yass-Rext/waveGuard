# version: "3.9"

services:

  #####################################################################
  # ZOOKEEPER
  #####################################################################
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    networks:
      - waveguard


  #####################################################################
  # KAFKA
  #####################################################################
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    networks:
      - waveguard


  #####################################################################
  # MINIO (Data Lake)
  #####################################################################
  minio:
    image: minio/minio
    container_name: minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - waveguard


  #####################################################################
# SPARK + JUPYTER
#####################################################################
  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile

    container_name: spark

    restart: unless-stopped

    depends_on:
      - kafka
      - minio

    working_dir: /opt/spark/work-dir

    volumes:
      - ./spark:/opt/spark/work-dir
      - ./producer:/opt/spark/producer
      - ./data/metrics:/tmp/metrics
      - ./checkpoints:/opt/spark/checkpoints
      - ./monitoring:/opt/spark/work-dir/monitoring

    ports:
      - "4040:4040"

    networks:
      - waveguard
  #####################################################################
  # AIRFLOW
  #####################################################################
  airflow:
    image: apache/airflow:2.7.1

    container_name: airflow

    restart: unless-stopped

    depends_on:
      - kafka

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AIRFLOW__WEBSERVER__SECRET_KEY: waveguard_secret

    command: >
      bash -c "
      airflow db init &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@waveguard.com &&
      airflow webserver
      "

    volumes:
      - ./dags:/opt/airflow/dags

      - ./producer:/opt/airflow/producer

      - ./spark:/opt/airflow/spark

    networks:
      - waveguard


  #####################################################################
  # GRAFANA
  #####################################################################
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource,grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring:/tmp/monitoring
      - ./data/metrics:/tmp/metrics
      - grafana_data:/var/lib/grafana
    networks:
      - waveguard
    depends_on:
      - minio
      - kafka
      - spark

volumes:
  minio_data:
  grafana_data:

networks:
  waveguard:
    driver: bridge


