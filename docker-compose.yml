# version: "3.9"

services:

  #####################################################################
  # ZOOKEEPER
  #####################################################################
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    networks:
      - waveguard


  #####################################################################
  # KAFKA
  #####################################################################
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

    networks:
      - waveguard


  #####################################################################
  # MINIO (Data Lake)
  #####################################################################
  minio:
    image: minio/minio
    container_name: minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - waveguard


  #####################################################################
# SPARK + JUPYTER
#####################################################################
  spark:
    image: jupyter/pyspark-notebook:latest

    container_name: spark

    restart: unless-stopped

    depends_on:
      - kafka
      - minio

    ports:
      - "8888:8888"
      - "4040:4040"

    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: password

      # Chargement automatique du connecteur Kafka
      PYSPARK_SUBMIT_ARGS: >
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
        pyspark-shell

    working_dir: /home/jovyan/work

    volumes:
      - ./work:/home/jovyan/work
      - ./spark:/home/jovyan/spark
      - ./producer:/home/jovyan/producer
      - ./monitoring:/home/jovyan/monitoring
      - ./data:/home/jovyan/data
      - ./checkpoints:/home/jovyan/checkpoints
      - ./requirements.txt:/tmp/requirements.txt

    command: >
      bash -c "
      pip install --quiet -r /tmp/requirements.txt &&
      start-notebook.sh
      "

    networks:
      - waveguard

  #####################################################################
  # AIRFLOW
  #####################################################################
  airflow:
    image: apache/airflow:2.7.1

    container_name: airflow

    restart: unless-stopped

    depends_on:
      - kafka

    ports:
      - "8080:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

      AIRFLOW__WEBSERVER__SECRET_KEY: waveguard_secret

    command: >
      bash -c "
      airflow db init &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@waveguard.com &&
      airflow webserver
      "

    volumes:
      - ./dags:/opt/airflow/dags

      - ./producer:/opt/airflow/producer

      - ./spark:/opt/airflow/spark

    networks:
      - waveguard


  #####################################################################
  # GRAFANA
  #####################################################################
  grafana:
    image: grafana/grafana:latest

    container_name: grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin

      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana

      - ./monitoring:/var/lib/waveguard

    networks:
      - waveguard


volumes:

  minio_data:

  grafana_data:


networks:

  waveguard:
    driver: bridge